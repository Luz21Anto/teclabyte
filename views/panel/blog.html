<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Blog</title>

  <!-- 🔸 Importamos varias fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Courier+Prime&family=Roboto+Slab:wght@400;600&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/panel/blog.css" />
</head>
<body>
<div class="editor-container">
  <!-- Área de escritura -->
  <main class="editor-main">
    <button class="btn" id="publicarBtn">Publicar</button>
    <a href="/admin/website" class="btn">Panel</a>
    <div id="editor" contenteditable="true" class="editor-area" data-placeholder="Escribí acá..."></div>
  </main>

  <!-- Menú lateral -->
  <aside class="editor-sidebar">
    <ul>
      <li class="tool-aa">
        Aa
        <ul class="submenu">
          <li class="format-bold">Negrita</li>
          <li class="format-italic">Cursiva</li>
        </ul>
      </li>
      <li class="tool-font">
        Fuente
        <ul class="submenu font-submenu">
          <li data-font="Arial">Arial</li>
          <li data-font="Courier New">Courier New</li>
          <li data-font="Times New Roman">Times New Roman</li>
          <li data-font="Comic Sans MS">Comic Sans</li>
        </ul>
      </li>
      <li class="tool-color">
        <span>Color</span>
        <input type="color" class="color-picker" />
      </li>
      <li class="tool-link">Link</li>
      <li class="tool-title tool-heading">Título</li>
      <li class="tool-subtitle tool-heading">Subtítulo</li>
      <li class="tool-encabezado3 tool-heading">Encabezado 1</li>
      <li class="tool-encabezado4 tool-heading">Encabezado 2</li>
      <li class="tool-encabezado5 tool-heading">Encabezado 3</li>
      <li class="tool-image">Cargar imagen</li>
    </ul>
  </aside>

  <button class="menu-toggle">☰</button>
</div>

<script src="/js/panel/blog.js" defer></script>

</body>
</html>
